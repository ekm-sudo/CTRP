# What: the project's identity card: name, version, Python version, and what it needs to run.
# Why:  "pip install -e ." then makes "import ctrp" work from anywhere (notebooks, scripts, tests).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrp"
version = "1.0.0.dev4"
description = "Customs Taxpayer Risk Profiling Model: ranks importers by compliance risk, with reasons"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Data Science Section, ITID, Uganda Revenue Authority" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "xlsxwriter>=3.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ipykernel", "nbconvert", "nbformat", "python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrp = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
